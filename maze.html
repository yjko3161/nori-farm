<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>🐰 토끼의 당근 찾기 미로</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7a59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="미로찾기">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<style>
  :root {
    --bg1: #fff5e6;
    --bg2: #ffe4b3;
    --wall: #6b4f2a;
    --wall2: #8a6a3d;
    --path: #f6ffd9;
    --path2: #e7f5bf;
    --accent: #ff7a59;
    --accent2: #ffd166;
    --ok: #6abf69;
    --text: #4a3520;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }
  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 14px 12px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  h1 {
    margin: 6px 0 2px;
    font-size: 24px;
    text-align: center;
    color: var(--accent);
    text-shadow: 2px 2px 0 #fff;
  }
  .topnav {
    width: 100%;
    display: flex; justify-content: flex-start;
  }
  .topnav a {
    text-decoration: none;
    color: var(--accent);
    background: #fff8e9;
    padding: 6px 12px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 2px 0 #e9d8b0;
  }
  .bar {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    background: #fff8e9;
    padding: 10px 12px;
    border-radius: 16px;
    box-shadow: 0 2px 0 #e9d8b0;
    font-weight: 700;
    font-size: 14px;
    text-align: center;
  }
  .bar .label { font-size: 11px; color: #7a6244; font-weight: 600; }
  .bar .val { font-size: 18px; color: var(--accent); }
  .bar .val.small { font-size: 16px; color: #555; }
  .board-wrap {
    background: #fff8e9;
    padding: 10px;
    border-radius: 18px;
    box-shadow: 0 4px 0 #e9d8b0;
  }
  #board {
    display: grid;
    gap: 2px;
    background: #c9a76a;
    padding: 4px;
    border-radius: 12px;
    touch-action: none;
  }
  .cell {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: transform 80ms ease;
    cursor: pointer;
  }
  .cell.wall {
    background: linear-gradient(135deg, var(--wall2), var(--wall));
    cursor: default;
  }
  .cell.path {
    background: linear-gradient(135deg, var(--path), var(--path2));
  }
  .cell.goal { background: linear-gradient(135deg, #ffe7a8, #ffcf6e); }
  .cell.trail { background: linear-gradient(135deg, #f8e7ff, #f0d4ff); }
  .cell.coin { background: linear-gradient(135deg, #fff3c4, #ffe48a); }
  .cell.fog { background: #1a1208; }
  .cell.dim { filter: brightness(0.5) saturate(0.7); }
  .cell.spike {
    background: linear-gradient(135deg, #4a0020, #7a0030);
    position: relative;
  }
  .cell.spike::after {
    content: "✦";
    position: absolute;
    color: #ff5050;
    font-weight: 900;
    font-size: 1.2em;
    text-shadow: 0 0 4px #ff0000;
    animation: spikePulse 1.2s ease-in-out infinite;
  }
  @keyframes spikePulse {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  .cell.player { transform: scale(1.05); }

  .controls {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 4px;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    justify-content: center;
    grid-column: 1 / -1;
  }
  .dpad button {
    border: none;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 3px 0 #e9d8b0;
    font-size: 26px;
    color: var(--accent);
    cursor: pointer;
    transition: transform 60ms ease, box-shadow 60ms ease;
  }
  .dpad button:active { transform: translateY(2px); box-shadow: 0 1px 0 #e9d8b0; }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 3; }
  .dpad .center {
    grid-column: 2; grid-row: 2;
    background: transparent; box-shadow: none; cursor: default;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }

  .btnrow {
    display: flex; gap: 8px; width: 100%; justify-content: center; flex-wrap: wrap;
  }
  .btn {
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: 12px;
    box-shadow: 0 3px 0 #c95838;
    font-size: 15px;
    cursor: pointer;
  }
  .btn.secondary {
    background: #fff;
    color: var(--accent);
    box-shadow: 0 3px 0 #e9d8b0;
  }
  .btn.danger {
    background: #d96363;
    box-shadow: 0 3px 0 #a14747;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c95838; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center;
    z-index: 10;
    padding: 16px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fffaf0;
    padding: 22px 22px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 10px 0 #c9a76a;
    max-width: 340px;
    width: 100%;
  }
  .modal h2 { margin: 0 0 10px; color: var(--accent); font-size: 26px; }
  .modal p { margin: 4px 0 12px; font-size: 15px; }
  .big { font-size: 44px; margin: 4px 0; }
  .stars { font-size: 28px; letter-spacing: 4px; }
  .score-big {
    font-size: 40px; font-weight: 900; color: var(--accent);
    margin: 6px 0; line-height: 1;
  }
  .input {
    width: 100%;
    border: 2px solid #f0dcae;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 16px;
    font-family: inherit;
    text-align: center;
    background: #fff;
    margin: 6px 0;
    color: var(--text);
  }
  .input:focus { outline: none; border-color: var(--accent); }

  .ranking {
    text-align: left; background: #fff; border-radius: 14px;
    padding: 6px; margin-top: 10px; max-height: 60vh; overflow-y: auto;
  }
  .ranking ol {
    margin: 0; padding: 0; list-style: none;
    counter-reset: rank;
  }
  .ranking li {
    counter-increment: rank;
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 4px 10px;
    padding: 10px 12px;
    border-bottom: 1px solid #f0e3c0;
    font-size: 17px;
  }
  .ranking li:last-child { border-bottom: none; }
  .ranking li::before {
    content: counter(rank) ".";
    color: #b29a6e; font-weight: 800; font-size: 17px;
    min-width: 1.6em; text-align: right;
    flex: 0 0 auto;
  }
  .ranking li.mine {
    background: #fff2d0; border-radius: 10px;
    font-weight: 800;
    border-bottom-color: transparent;
  }
  .ranking li.mine::before { color: var(--accent); }
  .ranking .name {
    order: 1;
    flex: 1 1 auto;
    font-size: 18px; color: var(--text);
    min-width: 0;
  }
  .ranking .score {
    order: 2;
    flex: 0 0 auto;
    color: var(--accent); font-weight: 800; font-size: 22px;
    white-space: nowrap;
  }
  .ranking .meta {
    order: 3;
    flex: 1 1 100%;
    color: #7a6244; font-size: 13px;
    margin-left: 1.8em;
    margin-top: -2px;
  }

  @media (max-width: 380px) {
    .dpad { grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); }
    h1 { font-size: 20px; }
    .bar .val { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topnav"><a href="./">← 메인</a></div>
  <h1>🐰 토끼야, 🥕 당근 찾아가자!</h1>

  <div class="bar">
    <div>
      <div class="label">레벨</div>
      <div class="val" id="levelNum">1</div>
    </div>
    <div>
      <div class="label">움직임</div>
      <div class="val small" id="moves">0</div>
    </div>
    <div>
      <div class="label">시간</div>
      <div class="val small" id="time">0초</div>
    </div>
    <div>
      <div class="label">🥕수집</div>
      <div class="val small" id="coins">0/0</div>
    </div>
    <div>
      <div class="label">점수</div>
      <div class="val" id="score">0</div>
    </div>
  </div>

  <div class="board-wrap">
    <div id="board"></div>
  </div>

  <div class="controls">
    <div class="dpad" aria-label="방향 버튼">
      <button class="up" data-dir="up" aria-label="위">⬆️</button>
      <button class="left" data-dir="left" aria-label="왼쪽">⬅️</button>
      <div class="center">🐰</div>
      <button class="right" data-dir="right" aria-label="오른쪽">➡️</button>
      <button class="down" data-dir="down" aria-label="아래">⬇️</button>
    </div>
  </div>

  <div class="btnrow">
    <button class="btn secondary" id="resetBtn">↺ 이 레벨 다시</button>
    <button class="btn secondary" id="muteBtn">🔊 소리</button>
    <button class="btn danger" id="stopBtn">🛑 그만하기</button>
  </div>

  <p style="font-size:12px; color:#7a6244; text-align:center; margin:6px 0 0;">
    방향키 ⬅️⬆️⬇️➡️ &nbsp;·&nbsp; 옆 칸 클릭 &nbsp;·&nbsp; 화면 버튼<br>
    🥕 다 모으고 결승선까지 · ✦ 가시 닿으면 죽음 · 100레벨까지 도전!
  </p>
</div>

<!-- 레벨 클리어 모달 -->
<div class="overlay" id="winOverlay">
  <div class="modal">
    <div class="big">🎉</div>
    <h2 id="winTitle">레벨 1 통과!</h2>
    <p id="winText">움직임 8번 · 5초 · +120점</p>
    <div class="stars" id="winStars">⭐⭐⭐</div>
    <div class="btnrow" style="margin-top:10px;">
      <button class="btn" id="winNext">다음 레벨 ▶</button>
    </div>

</div>

<!-- 가시 트랩 — 게임 오버 -->
<div class="overlay" id="deadOverlay">
  <div class="modal">
    <div class="big">💥</div>
    <h2>가시에 닿았어요!</h2>
    <p id="deadText">레벨 1 · 도전 횟수 X번</p>
    <div class="btnrow" style="margin-top:10px;">
      <button class="btn" id="deadRetryBtn">↺ 이 레벨 다시</button>
      <button class="btn danger" id="deadEndBtn">🏁 그만하기</button>
    </div>
  </div>
</div>

<!-- 게임 종료 (이름 입력) -->
<div class="overlay" id="endOverlay">
  <div class="modal">
    <div class="big">🏁</div>
    <h2>게임 종료!</h2>
    <p id="endSummary">레벨 5까지 도전 · 움직임 50번</p>
    <div class="score-big" id="endScore">0</div>
    <p>이름을 적어줘! (랭킹에 올라가요)</p>
    <input class="input" id="nameInput" maxlength="8" placeholder="예: 토끼1" />
    <div class="btnrow">
      <button class="btn" id="saveScoreBtn">랭킹에 올리기 🏆</button>
    </div>
  </div>
</div>

<!-- 랭킹 화면 -->
<div class="overlay" id="rankOverlay">
  <div class="modal">
    <div class="big">🏆</div>
    <h2>명예의 전당 TOP 10</h2>
    <div class="ranking" id="rankingList"></div>
    <div class="btnrow" style="margin-top:12px;">
      <button class="btn" id="rankRestartBtn">다시 도전 🔄</button>
    </div>
  </div>
</div>

<script>
// ===== 효과음 (Web Audio API) =====
let audioCtx = null;
let muted = false;
try { muted = localStorage.getItem("miro_muted") === "1"; } catch {}

function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type = "sine", gain = 0.15, when = 0) {
  if (muted) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime + when;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function sweep(f1, f2, dur, type = "sine", gain = 0.15, when = 0) {
  if (muted) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime + when;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f1, t0);
  osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
const sfx = {
  step()  { tone(520 + Math.random() * 60, 0.06, "triangle", 0.08); },
  bump()  { sweep(220, 90, 0.12, "square", 0.12); },
  win()   {
    tone(523, 0.12, "triangle", 0.18, 0);
    tone(659, 0.12, "triangle", 0.18, 0.12);
    tone(784, 0.12, "triangle", 0.18, 0.24);
    tone(1046, 0.25, "triangle", 0.2, 0.36);
  },
  gameover() {
    tone(440, 0.2, "triangle", 0.15, 0);
    tone(330, 0.2, "triangle", 0.15, 0.18);
    tone(220, 0.4, "triangle", 0.15, 0.36);
  },
  rank() { tone(880, 0.08, "sine", 0.12, 0); tone(1175, 0.1, "sine", 0.12, 0.08); tone(1568, 0.15, "sine", 0.12, 0.18); },
  coin() { tone(988, 0.06, "triangle", 0.16, 0); tone(1319, 0.1, "triangle", 0.14, 0.05); },
};

// ===== 미로 생성: Recursive Backtracker =====
// 셀 cw × ch  →  실제 그리드 (2*cw+1) × (2*ch+1)
// 시작: 좌상단(1,1), 도착: 그리드 맨 끝쪽 빈칸을 BFS로 가장 먼 곳으로 정함 (난이도↑)
function generateMaze(cw, ch) {
  const W = 2 * cw + 1, H = 2 * ch + 1;
  const g = Array.from({ length: H }, () => Array(W).fill("#"));
  for (let y = 0; y < ch; y++)
    for (let x = 0; x < cw; x++)
      g[2 * y + 1][2 * x + 1] = ".";
  const visited = new Set(["0,0"]);
  const stack = [[0, 0]];
  while (stack.length) {
    const [cx, cy] = stack[stack.length - 1];
    const neigh = [];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx >= 0 && nx < cw && ny >= 0 && ny < ch && !visited.has(nx + "," + ny))
        neigh.push([nx, ny, dx, dy]);
    }
    if (neigh.length) {
      const [nx, ny, dx, dy] = neigh[Math.floor(Math.random() * neigh.length)];
      // 벽 부수기
      g[2 * cy + 1 + dy][2 * cx + 1 + dx] = ".";
      visited.add(nx + "," + ny);
      stack.push([nx, ny]);
    } else stack.pop();
  }
  // 도착점: 시작(1,1)에서 BFS로 가장 먼 빈칸 (parent 추적 → 솔루션 경로 복원)
  const sx = 1, sy = 1;
  const dist = Array.from({ length: H }, () => Array(W).fill(-1));
  const parent = Array.from({ length: H }, () => Array(W).fill(null));
  dist[sy][sx] = 0;
  const q = [[sx, sy]];
  let far = [sx, sy];
  while (q.length) {
    const [x, y] = q.shift();
    if (dist[y][x] > dist[far[1]][far[0]]) far = [x, y];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      if (g[ny][nx] === "#") continue;
      if (dist[ny][nx] !== -1) continue;
      dist[ny][nx] = dist[y][x] + 1;
      parent[ny][nx] = [x, y];
      q.push([nx, ny]);
    }
  }
  // 솔루션 경로 복원 (시작→목표)
  const path = [];
  let cur = far;
  while (cur) {
    path.push(cur);
    const [cx, cy] = cur;
    cur = parent[cy][cx];
  }
  path.reverse();
  return {
    grid: g, W, H,
    sx, sy, gx: far[0], gy: far[1],
    shortest: dist[far[1]][far[0]],
    solution: path,
  };
}

// ===== 상태 =====
const MAX_LEVEL = 100;
let level = 1;
let totalMoves = 0;
let totalSeconds = 0;
let totalScore = 0;
let levelMoves = 0;
let levelStart = 0;
let timerId = null;
let maze = null;
let px = 0, py = 0;
let trail = new Set();
let won = false;
let gameOverFlag = false;
let retryCount = 0;              // 이번 레벨에서 가시로 죽은 횟수
let coins = new Set();          // 남은 당근 위치 "x,y"
let coinsTotal = 0;              // 이번 레벨 당근 총 개수
let coinsGot = 0;                // 모은 개수
let spikes = new Set();         // 가시 위치 "x,y"
let fogRadius = 0;               // 0 = 포그 없음

const $ = (q) => document.querySelector(q);
const boardEl = $("#board");

// 레벨별 그리드 크기 (셀 단위, 최대 10셀=21×21)
// L1=3, L13=4, L25=5, L37=6, L49=7, L61=8, L73=9, L85+=10
function cellsForLevel(n) {
  return Math.min(3 + Math.floor((n - 1) / 12), 10);
}

// 레벨별 수집 당근 개수 (도착 당근 제외)
function bonusCoinsForLevel(n) {
  if (n < 3) return 0;
  if (n < 10) return 1;
  if (n < 25) return 2;
  if (n < 50) return 3;
  if (n < 80) return 4;
  return 5;
}

// 레벨별 시야 반경 (0 = 포그 없음)
function fogForLevel(n) {
  if (n < 5) return 0;
  if (n < 12) return 5;
  if (n < 25) return 4;
  if (n < 50) return 3;
  return 2;   // L50+ 시야 2칸 (거의 안 보임)
}

// 레벨별 가시 개수 — 빈 셀 대비 비율로 계산 (솔루션 경로는 안전)
// L3: 약 3%, L20: 약 15%, L50: 25%, L100: 35%
function spikeRatioForLevel(n) {
  if (n < 3) return 0;
  return Math.min(0.35, 0.02 + (n - 3) * 0.0035);
}

function startLevel(n) {
  level = n;
  const c = cellsForLevel(n);
  maze = generateMaze(c, c);
  px = maze.sx; py = maze.sy;
  trail = new Set([px + "," + py]);
  levelMoves = 0;
  levelStart = Date.now();
  won = false;
  gameOverFlag = false;
  retryCount = 0;
  fogRadius = fogForLevel(n);
  placeBonusCoins(bonusCoinsForLevel(n));
  coinsGot = 0;
  // 가시는 코인 배치 후 (코인 위치 보호)
  placeSpikes(n);
  $("#levelNum").textContent = n;
  $("#moves").textContent = "0";
  $("#time").textContent = "0초";
  $("#coins").textContent = `${coinsGot}/${coinsTotal}`;
  renderBoard();
  if (!timerId) {
    timerId = setInterval(() => {
      if (!won && !gameOverFlag) {
        const s = Math.floor((Date.now() - levelStart) / 1000);
        $("#time").textContent = s + "초";
      }
    }, 250);
  }
}

// 같은 레벨 재시도 (가시로 죽었을 때 — 같은 미로 유지)
function retryLevel() {
  px = maze.sx; py = maze.sy;
  trail = new Set([px + "," + py]);
  levelMoves = 0;
  levelStart = Date.now();
  won = false;
  gameOverFlag = false;
  coinsGot = 0;
  // 코인은 다시 배치 (먹은 게 부활)
  placeBonusCoins(bonusCoinsForLevel(level));
  // 가시는 그대로 유지 (사용자가 위치 학습 가능 → 약간의 자비)
  $("#moves").textContent = "0";
  $("#time").textContent = "0초";
  $("#coins").textContent = `${coinsGot}/${coinsTotal}`;
  renderBoard();
}

// 빈 칸 중에서 시작·도착·서로간 충분히 떨어진 곳에 당근 배치
function placeBonusCoins(want) {
  coins = new Set();
  coinsTotal = 0;
  if (want <= 0) return;
  const W = maze.W, H = maze.H;
  const open = [];
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++)
      if (maze.grid[y][x] !== "#"
          && !(x === maze.sx && y === maze.sy)
          && !(x === maze.gx && y === maze.gy))
        open.push([x, y]);
  // 셔플
  for (let i = open.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [open[i], open[j]] = [open[j], open[i]];
  }
  const minDist = Math.max(2, Math.floor(Math.min(W, H) / 3));
  const picked = [];
  for (const [x, y] of open) {
    if (picked.length >= want) break;
    const tooClose = picked.some(([px2, py2]) =>
      Math.abs(px2 - x) + Math.abs(py2 - y) < minDist);
    if (!tooClose) picked.push([x, y]);
  }
  picked.forEach(([x, y]) => coins.add(x + "," + y));
  coinsTotal = coins.size;
}

// 가시 배치 — 솔루션 경로 + 시작/목표 + 인접 + 코인 위치는 안전
function placeSpikes(n) {
  spikes = new Set();
  const ratio = spikeRatioForLevel(n);
  if (ratio <= 0) return;
  const W = maze.W, H = maze.H;
  // 안전한 셀 (가시 못 두는 곳)
  const safe = new Set();
  // 솔루션 경로 전체
  for (const [x, y] of maze.solution) safe.add(x + "," + y);
  // 시작·목표 + 한 칸 인접 (게임 시작/끝 직전 즉사 방지)
  for (const [bx, by] of [[maze.sx, maze.sy], [maze.gx, maze.gy]]) {
    safe.add(bx + "," + by);
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      safe.add((bx+dx) + "," + (by+dy));
    }
  }
  // 코인 위치
  for (const k of coins) safe.add(k);
  // 빈 셀 후보
  const cands = [];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (maze.grid[y][x] === "#") continue;
      const k = x + "," + y;
      if (safe.has(k)) continue;
      cands.push(k);
    }
  }
  // 셔플
  for (let i = cands.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cands[i], cands[j]] = [cands[j], cands[i]];
  }
  // 전체 빈 셀 수 기준 비율로 결정 (후보 셀이 적으면 그 한도까지)
  const totalOpen = cands.length + safe.size;
  const want = Math.min(cands.length, Math.floor(totalOpen * ratio));
  for (let i = 0; i < want; i++) spikes.add(cands[i]);
}

function renderBoard() {
  const W = maze.W, H = maze.H;
  boardEl.style.gridTemplateColumns = `repeat(${W}, 1fr)`;
  const avail = Math.min(window.innerWidth - 40, 500) - 28;
  const cellSize = Math.max(14, Math.floor(avail / W));
  boardEl.style.width = (cellSize * W + 8 + (W - 1) * 2) + "px";

  boardEl.innerHTML = "";
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const div = document.createElement("div");
      const c = maze.grid[y][x];
      const key = x + "," + y;
      const isGoal = (x === maze.gx && y === maze.gy);
      const isCoin = coins.has(key);
      const isSpike = spikes.has(key);
      const isPlayer = (x === px && y === py);
      div.className = "cell " + (c === "#" ? "wall" : "path");
      if (isGoal) div.classList.add("goal");
      if (isCoin) div.classList.add("coin");
      if (isSpike) div.classList.add("spike");
      if (trail.has(key) && !isPlayer && !isCoin && !isSpike) div.classList.add("trail");
      if (isPlayer) {
        div.classList.add("player");
        div.textContent = "🐰";
      } else if (isCoin) {
        div.textContent = "🥕";
      } else if (isGoal) {
        // 보너스 당근이 다 모이면 골 당근, 아니면 자물쇠
        div.textContent = (coinsGot >= coinsTotal) ? "🥕" : "🔒";
      }
      // 포그 처리: 플레이어와 거리 > fogRadius 면 어둡게/숨김
      if (fogRadius > 0) {
        const dist = Math.abs(x - px) + Math.abs(y - py);
        if (dist > fogRadius + 1) {
          div.classList.add("fog");
          div.textContent = "";
          // 포그 안에선 가시도 숨김
          div.classList.remove("spike");
        } else if (dist > fogRadius) {
          div.classList.add("dim");
        }
      }
      div.onclick = () => onCellClick(x, y);
      boardEl.appendChild(div);
    }
  }
}

function onCellClick(x, y) {
  if (won) return;
  const dx = x - px, dy = y - py;
  if (Math.abs(dx) + Math.abs(dy) !== 1) return;
  tryMove(dx, dy);
}

function tryMove(dx, dy) {
  if (won || gameOverFlag) return;
  const nx = px + dx, ny = py + dy;
  if (nx < 0 || ny < 0 || nx >= maze.W || ny >= maze.H) { sfx.bump(); return; }
  if (maze.grid[ny][nx] === "#") { sfx.bump(); return; }
  px = nx; py = ny;
  trail.add(px + "," + py);
  levelMoves++;
  $("#moves").textContent = levelMoves;
  const key = px + "," + py;
  // 가시 체크 — 즉시 게임 오버
  if (spikes.has(key)) {
    renderBoard();
    spikeDeath();
    return;
  }
  // 당근 줍기
  let gotCoin = false;
  if (coins.has(key)) {
    coins.delete(key);
    coinsGot++;
    $("#coins").textContent = `${coinsGot}/${coinsTotal}`;
    gotCoin = true;
    sfx.coin && sfx.coin();
  }
  renderBoard();
  // 골 도달은 당근 다 모은 뒤에만 인정
  if (px === maze.gx && py === maze.gy && coinsGot >= coinsTotal) winLevel();
  else if (!gotCoin) sfx.step();
}

function spikeDeath() {
  gameOverFlag = true;
  retryCount++;
  sfx.gameover();
  $("#deadText").textContent =
    `레벨 ${level} · 이 레벨 도전 ${retryCount}번째 · 점수 변동 없음`;
  $("#deadOverlay").classList.add("show");
}

function winLevel() {
  won = true;
  sfx.win();
  const sec = Math.max(1, Math.round((Date.now() - levelStart) / 1000));
  // 점수: 레벨 보너스 + 최단경로 보너스 - 페널티 + 수집/포그/가시 보너스
  const base = 100 + level * 20;
  const efficiency = Math.max(0, maze.shortest * 2 - levelMoves);
  const speedBonus = Math.max(0, 60 - sec);
  const coinBonus = coinsTotal * 30;
  const fogBonus = fogRadius > 0 ? (40 + (5 - fogRadius) * 20) : 0;
  const spikeBonus = spikes.size * 5;
  const retryPenalty = retryCount * 50;
  const milestoneBonus = (level % 10 === 0) ? level * 50 : 0;  // 10레벨마다 보너스
  const gain = Math.max(20, base + efficiency + speedBonus + coinBonus + fogBonus + spikeBonus + milestoneBonus - retryPenalty);
  totalScore += gain;
  totalMoves += levelMoves;
  totalSeconds += sec;
  $("#score").textContent = totalScore;

  // 별 기준 — 가시 회피하느라 우회 발생 감안
  const extra = coinsTotal * 4 + Math.floor(spikes.size * 0.5);
  const par = maze.shortest + extra;
  let stars = "⭐";
  if (levelMoves <= par + 1 && retryCount === 0) stars = "⭐⭐⭐";
  else if (levelMoves <= Math.floor(par * 1.5) && retryCount <= 1) stars = "⭐⭐";

  const isFinal = level >= MAX_LEVEL;
  $("#winTitle").textContent = isFinal
    ? `🏆 100레벨 챔피언!`
    : `레벨 ${level} 통과!`;
  $("#winText").textContent =
    `움직임 ${levelMoves}번 · 최단 ${maze.shortest}번 · ${sec}초` +
    (retryCount > 0 ? ` · 재도전 ${retryCount}번` : "") +
    ` · +${gain}점`;
  $("#winStars").textContent = stars;
  // 100레벨 클리어 시 "다음" 버튼은 게임 종료로
  $("#winNext").textContent = isFinal ? "🏁 점수 등록" : "다음 레벨 ▶";
  $("#winOverlay").classList.add("show");
}

function nextLevel() {
  $("#winOverlay").classList.remove("show");
  if (level >= MAX_LEVEL) {
    // 100레벨 챔피언 → 점수 등록 화면
    endGame();
    return;
  }
  startLevel(level + 1);
}

// ===== 게임 종료 / 랭킹 =====
const RANK_KEY = "miro_rank_v1";
const NAME_KEY = "miro_last_name";
function loadRanking() {
  try { return JSON.parse(localStorage.getItem(RANK_KEY)) || []; } catch { return []; }
}
function saveRanking(arr) {
  try { localStorage.setItem(RANK_KEY, JSON.stringify(arr)); } catch {}
}

function endGame() {
  if (won) {
    // 이미 클리어 모달 떠있으면 닫고
    $("#winOverlay").classList.remove("show");
  }
  sfx.gameover();
  $("#endSummary").textContent =
    `레벨 ${level}까지 · 움직임 ${totalMoves}번 · ${totalSeconds}초`;
  $("#endScore").textContent = totalScore;
  let last = "";
  try { last = localStorage.getItem(NAME_KEY) || ""; } catch {}
  $("#nameInput").value = last;
  $("#endOverlay").classList.add("show");
  setTimeout(() => $("#nameInput").focus(), 100);
}

let lastSavedEntryId = null;

async function postServerRanking(entry) {
  try {
    const r = await fetch("/api/ranking/maze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(entry),
    });
    if (r.ok) return await r.json();
  } catch (e) { /* 오프라인 */ }
  return null;
}
async function fetchServerRanking() {
  try {
    const r = await fetch("/api/ranking/maze", { cache: "no-store" });
    if (r.ok) return await r.json();
  } catch (e) {}
  return null;
}

async function saveScore() {
  const name = ($("#nameInput").value || "").trim().slice(0, 8) || "토끼";
  try { localStorage.setItem(NAME_KEY, name); } catch {}
  const entry = {
    id: Date.now() + Math.random(),
    name, score: totalScore, level, moves: totalMoves, seconds: totalSeconds,
    date: new Date().toISOString().slice(0, 10),
  };
  // 1) 로컬에 백업
  const localList = loadRanking();
  localList.push(entry);
  localList.sort((a, b) => b.score - a.score);
  saveRanking(localList.slice(0, 10));
  lastSavedEntryId = entry.id;
  // 2) 서버에도 시도 (실패해도 무시)
  await postServerRanking(entry);
  $("#endOverlay").classList.remove("show");
  showRanking();
  sfx.rank();
}

async function showRanking() {
  const list = $("#rankingList");
  list.innerHTML = '<p style="text-align:center; color:#7a6244; padding:8px;">불러오는 중…</p>';
  $("#rankOverlay").classList.add("show");

  // 서버 우선, 실패 시 로컬
  const server = await fetchServerRanking();
  const ranking = server !== null ? server : loadRanking();
  const source = server !== null ? "🌐 가족 공용" : "📱 이 기기만";

  if (ranking.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7a6244; padding:8px;">아직 기록이 없어요</p>';
  } else {
    const ol = document.createElement("ol");
    ranking.forEach((e) => {
      const li = document.createElement("li");
      if (e.id === lastSavedEntryId) li.className = "mine";
      li.innerHTML = `
        <span class="name">${escapeHtml(e.name)}</span>
        <span class="meta">L${e.level} · ${e.moves}회 · ${e.seconds}초 · ${e.date}</span>
        <span class="score">${e.score}점</span>
      `;
      ol.appendChild(li);
    });
    list.innerHTML = `<p style="text-align:center; color:#7a6244; font-size:12px; margin:0 0 6px;">${source}</p>`;
    list.appendChild(ol);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function restartGame() {
  $("#rankOverlay").classList.remove("show");
  level = 1; totalMoves = 0; totalSeconds = 0; totalScore = 0;
  $("#score").textContent = "0";
  startLevel(1);
}

// ===== 이벤트 =====
window.addEventListener("keydown", (e) => {
  // 입력창에 포커스가 있을 땐 키보드 미로 조작 막기
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  const map = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
                w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };
  const m = map[e.key];
  if (m) { e.preventDefault(); tryMove(m[0], m[1]); }
});
document.querySelectorAll(".dpad button[data-dir]").forEach(b => {
  b.addEventListener("click", (e) => {
    e.preventDefault();
    const d = b.dataset.dir;
    if (d === "up") tryMove(0, -1);
    else if (d === "down") tryMove(0, 1);
    else if (d === "left") tryMove(-1, 0);
    else if (d === "right") tryMove(1, 0);
  });
});

$("#resetBtn").onclick = () => {
  // 같은 레벨, 같은 크기 새 미로
  startLevel(level);
};
$("#stopBtn").onclick = () => endGame();
$("#winNext").onclick = () => nextLevel();
$("#saveScoreBtn").onclick = () => saveScore();
$("#rankRestartBtn").onclick = () => restartGame();

// 가시 사망 모달
$("#deadRetryBtn").onclick = () => {
  $("#deadOverlay").classList.remove("show");
  retryLevel();
};
$("#deadEndBtn").onclick = () => {
  $("#deadOverlay").classList.remove("show");
  endGame();
};

// 음소거
const muteBtn = $("#muteBtn");
function refreshMuteBtn() { muteBtn.textContent = muted ? "🔇 소리" : "🔊 소리"; }
refreshMuteBtn();
muteBtn.onclick = () => {
  muted = !muted;
  try { localStorage.setItem("miro_muted", muted ? "1" : "0"); } catch {}
  refreshMuteBtn();
  if (!muted) { ensureAudio(); sfx.step(); }
};
// 첫 입력에서 오디오 깨우기
function wakeAudioOnce() {
  ensureAudio();
  window.removeEventListener("pointerdown", wakeAudioOnce);
  window.removeEventListener("keydown", wakeAudioOnce);
}
window.addEventListener("pointerdown", wakeAudioOnce);
window.addEventListener("keydown", wakeAudioOnce);

window.addEventListener("resize", () => { if (maze) renderBoard(); });

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

startLevel(1);
</script>
