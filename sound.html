<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>🎵 소리 따라하기</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7a59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="소리따라">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root { --accent: #ff7a59; --text: #4a3520; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    background: linear-gradient(160deg, #fff5e6, #ffe4b3);
    color: var(--text); min-height: 100vh;
    user-select: none; -webkit-user-select: none; overflow-x: hidden;
  }
  .app { max-width: 460px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  h1 { margin: 4px 0 2px; font-size: 22px; color: var(--accent); text-shadow: 2px 2px 0 #fff; }
  .topnav { width: 100%; }
  .topnav a { text-decoration: none; color: var(--accent); background: #fff8e9;
    padding: 6px 12px; border-radius: 10px; font-weight: 700; font-size: 14px; box-shadow: 0 2px 0 #e9d8b0; }
  .bar { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    background: #fff8e9; padding: 10px; border-radius: 16px; box-shadow: 0 2px 0 #e9d8b0; text-align: center; }
  .bar .label { font-size: 11px; color: #7a6244; font-weight: 600; }
  .bar .val { font-size: 18px; color: var(--accent); font-weight: 800; }

  .status {
    background: #fff8e9; padding: 12px 18px; border-radius: 14px;
    box-shadow: 0 2px 0 #e9d8b0; font-weight: 800; font-size: 18px;
    color: var(--accent);
  }

  .pads {
    width: 100%; aspect-ratio: 1/1;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding: 14px; background: #fff8e9; border-radius: 22px;
    box-shadow: 0 5px 0 #e9d8b0;
  }
  .pad {
    border-radius: 18px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.25);
    cursor: pointer;
    transition: transform 0.1s, filter 0.1s, box-shadow 0.1s;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
  }
  .pad.red    { background: #e85a5a; }
  .pad.blue   { background: #5aa1e8; }
  .pad.yellow { background: #f0c84a; }
  .pad.green  { background: #6abf69; }
  .pad.active { filter: brightness(1.5); transform: scale(0.96); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  .pad.locked { cursor: not-allowed; opacity: 0.85; }

  .btnrow { display: flex; gap: 8px; width: 100%; justify-content: center; flex-wrap: wrap; }
  .btn { border: none; background: var(--accent); color: white; font-weight: 700;
    padding: 10px 16px; border-radius: 12px; box-shadow: 0 3px 0 #c95838; font-size: 15px; cursor: pointer; }
  .btn.secondary { background: #fff; color: var(--accent); box-shadow: 0 3px 0 #e9d8b0; }
  .btn.danger { background: #d96363; box-shadow: 0 3px 0 #a14747; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c95838; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .overlay.show { display: flex; }
  .modal { background: #fffaf0; padding: 22px; border-radius: 22px; text-align: center;
    box-shadow: 0 10px 0 #c9a76a; max-width: 400px; width: 100%; }
  .modal h2 { margin: 0 0 10px; color: var(--accent); font-size: 26px; }
  .big { font-size: 44px; margin: 4px 0; }
  .score-big { font-size: 40px; font-weight: 900; color: var(--accent); margin: 6px 0; }
  .input { width: 100%; border: 2px solid #f0dcae; border-radius: 12px; padding: 10px;
    font-size: 16px; font-family: inherit; text-align: center; background: #fff; margin: 6px 0; color: var(--text); }
  .ranking {
    text-align: left; background: #fff; border-radius: 14px;
    padding: 6px; margin-top: 10px; max-height: 60vh; overflow-y: auto;
  }
  .ranking ol {
    margin: 0; padding: 0; list-style: none;
    counter-reset: rank;
  }
  .ranking li {
    counter-increment: rank;
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 4px 10px;
    padding: 10px 12px;
    border-bottom: 1px solid #f0e3c0;
    font-size: 17px;
  }
  .ranking li:last-child { border-bottom: none; }
  .ranking li::before {
    content: counter(rank) ".";
    color: #b29a6e; font-weight: 800; font-size: 17px;
    min-width: 1.6em; text-align: right;
    flex: 0 0 auto;
  }
  .ranking li.mine {
    background: #fff2d0; border-radius: 10px;
    font-weight: 800;
    border-bottom-color: transparent;
  }
  .ranking li.mine::before { color: var(--accent); }
  .ranking .name {
    order: 1;
    flex: 1 1 auto;
    font-size: 18px; color: var(--text);
    min-width: 0;
  }
  .ranking .score {
    order: 2;
    flex: 0 0 auto;
    color: var(--accent); font-weight: 800; font-size: 22px;
    white-space: nowrap;
  }
  .ranking .meta {
    order: 3;
    flex: 1 1 100%;
    color: #7a6244; font-size: 13px;
    margin-left: 1.8em;
    margin-top: -2px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="topnav"><a href="./">← 메인</a></div>
  <h1>🎵 소리 따라하기</h1>

  <div class="bar">
    <div><div class="label">레벨</div><div class="val" id="levelNum">1</div></div>
    <div><div class="label">소리 길이</div><div class="val" id="seqLen">1</div></div>
    <div><div class="label">점수</div><div class="val" id="score">0</div></div>
  </div>

  <div class="status" id="status">시작 버튼을 눌러요!</div>

  <div class="pads" id="pads">
    <div class="pad red" data-i="0">🍓</div>
    <div class="pad blue" data-i="1">🐬</div>
    <div class="pad yellow" data-i="2">⭐</div>
    <div class="pad green" data-i="3">🐢</div>
  </div>

  <div class="btnrow">
    <button class="btn" id="startBtn">▶ 시작</button>
    <button class="btn secondary" id="muteBtn">🔊 소리</button>
    <button class="btn danger" id="stopBtn">🛑 그만하기</button>
  </div>

  <p style="font-size:12px; color:#7a6244; text-align:center; margin:6px 0 0;">
    소리/색을 잘 보고 듣고 같은 순서로 눌러요!
  </p>
</div>

<div class="overlay" id="endOverlay">
  <div class="modal">
    <div class="big">🏁</div>
    <h2 id="endTitle">게임 종료!</h2>
    <p id="endSummary">…</p>
    <div class="score-big" id="endScore">0</div>
    <p>이름을 적어줘!</p>
    <input class="input" id="nameInput" maxlength="8" placeholder="예: 토끼1">
    <div class="btnrow">
      <button class="btn" id="saveScoreBtn">랭킹에 올리기 🏆</button>
    </div>
  </div>
</div>

<div class="overlay" id="rankOverlay">
  <div class="modal">
    <div class="big">🏆</div>
    <h2>소리따라 랭킹 TOP 10</h2>
    <div class="ranking" id="rankingList"></div>
    <div class="btnrow" style="margin-top:12px;">
      <button class="btn" id="rankRestartBtn">다시 도전 🔄</button>
    </div>
  </div>
</div>

<script>
let audioCtx = null, muted = false;
try { muted = localStorage.getItem("sound_muted") === "1"; } catch {}
function ensureAudio() {
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(f, dur, type="sine", gain=0.18, when=0) {
  if (muted) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime + when;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const NOTES = [330, 440, 554, 660];  // 미, 라, 도#, 미
const sfx = {
  pad(i) { tone(NOTES[i], 0.4, "sine", 0.2); },
  wrong() { tone(180, 0.3, "square", 0.15); },
  win() { tone(523, 0.1, "triangle", 0.18); tone(659, 0.1, "triangle", 0.18, 0.1); tone(784, 0.15, "triangle", 0.18, 0.2); },
  end() { tone(440, 0.2, "triangle", 0.15); tone(330, 0.2, "triangle", 0.15, 0.18); tone(220, 0.4, "triangle", 0.15, 0.36); },
};

const $ = q => document.querySelector(q);
let level = 1, sequence = [], userPos = 0, totalScore = 0;
let playing = false, accepting = false;
let started = false;

function setStatus(text) { $("#status").textContent = text; }

async function flashPad(i, dur=400) {
  const el = document.querySelector(`.pad[data-i="${i}"]`);
  if (!el) return;
  el.classList.add("active");
  sfx.pad(i);
  await sleep(dur);
  el.classList.remove("active");
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function playSequence() {
  playing = true;
  accepting = false;
  $("#pads").querySelectorAll(".pad").forEach(p => p.classList.add("locked"));
  setStatus("잘 들어요…");
  await sleep(500);
  const speed = Math.max(180, 600 - level * 25);
  for (const i of sequence) {
    await flashPad(i, speed);
    await sleep(120);
  }
  playing = false;
  accepting = true;
  userPos = 0;
  $("#pads").querySelectorAll(".pad").forEach(p => p.classList.remove("locked"));
  setStatus("이제 따라해보세요!");
}

function nextLevel(addStep=true) {
  if (addStep) {
    sequence.push(Math.floor(Math.random() * 4));
  }
  $("#levelNum").textContent = level;
  $("#seqLen").textContent = sequence.length;
  playSequence();
}

function startGame() {
  if (started) return;
  started = true;
  $("#startBtn").style.display = "none";
  ensureAudio();
  level = 1; sequence = []; totalScore = 0;
  $("#score").textContent = "0";
  nextLevel();
}

document.querySelectorAll(".pad").forEach(p => {
  p.onclick = () => {
    if (!accepting) return;
    const i = parseInt(p.dataset.i);
    flashPad(i, 250);
    if (sequence[userPos] === i) {
      userPos++;
      if (userPos === sequence.length) {
        accepting = false;
        // 레벨 클리어
        const gain = 50 + level * 10;
        totalScore += gain;
        $("#score").textContent = totalScore;
        setStatus("정답! ⭐");
        sfx.win();
        setTimeout(() => {
          level++;
          nextLevel();
        }, 800);
      }
    } else {
      // 틀림
      accepting = false;
      sfx.wrong();
      setStatus("틀렸어요 😢");
      setTimeout(() => endGame(), 800);
    }
  };
});

// 랭킹
const RANK_KEY = "sound_rank_v1";
const NAME_KEY = "sound_last_name";
function loadRanking() { try { return JSON.parse(localStorage.getItem(RANK_KEY)) || []; } catch { return []; } }
function saveRanking(arr) { try { localStorage.setItem(RANK_KEY, JSON.stringify(arr)); } catch {} }
async function postServer(entry) {
  try { const r = await fetch("/api/ranking/sound", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(entry) }); if (r.ok) return await r.json(); } catch {}
  return null;
}
async function fetchServer() {
  try { const r = await fetch("/api/ranking/sound", { cache:"no-store" }); if (r.ok) return await r.json(); } catch {}
  return null;
}

let lastSavedEntryId = null;
function endGame() {
  accepting = false;
  sfx.end();
  $("#endTitle").textContent = "🏁 게임 종료!";
  $("#endSummary").textContent = `레벨 ${level} · 소리 ${sequence.length}개까지`;
  $("#endScore").textContent = totalScore;
  let last = "";
  try { last = localStorage.getItem(NAME_KEY) || ""; } catch {}
  $("#nameInput").value = last;
  $("#endOverlay").classList.add("show");
}

async function saveScore() {
  const name = ($("#nameInput").value || "").trim().slice(0, 8) || "토끼";
  try { localStorage.setItem(NAME_KEY, name); } catch {}
  const entry = {
    id: Date.now() + Math.random(),
    name, score: totalScore, level,
    seconds: 0,
    date: new Date().toISOString().slice(0, 10),
  };
  const local = loadRanking();
  local.push(entry); local.sort((a,b)=>b.score-a.score);
  saveRanking(local.slice(0, 10));
  lastSavedEntryId = entry.id;
  await postServer(entry);
  $("#endOverlay").classList.remove("show");
  showRanking();
}

async function showRanking() {
  const list = $("#rankingList");
  list.innerHTML = '<p style="text-align:center; color:#7a6244; padding:8px;">불러오는 중…</p>';
  $("#rankOverlay").classList.add("show");
  const server = await fetchServer();
  const ranking = server !== null ? server : loadRanking();
  const source = server !== null ? "🌐 가족 공용" : "📱 이 기기만";
  if (ranking.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7a6244; padding:8px;">아직 기록이 없어요</p>';
  } else {
    const ol = document.createElement("ol");
    ranking.forEach(e => {
      const li = document.createElement("li");
      if (e.id === lastSavedEntryId) li.className = "mine";
      li.innerHTML = `
        <span>${escapeHtml(e.name)}</span>
        <span class="meta">L${e.level}</span>
        <span class="score">${e.score}점</span>`;
      ol.appendChild(li);
    });
    list.innerHTML = `<p style="text-align:center; color:#7a6244; font-size:12px; margin:0 0 6px;">${source}</p>`;
    list.appendChild(ol);
  }
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function restart() {
  $("#rankOverlay").classList.remove("show");
  started = false;
  $("#startBtn").style.display = "";
  setStatus("시작 버튼을 눌러요!");
}

$("#startBtn").onclick = () => startGame();
$("#stopBtn").onclick = () => endGame();
$("#saveScoreBtn").onclick = () => saveScore();
$("#rankRestartBtn").onclick = () => restart();
const muteBtn = $("#muteBtn");
function refreshMute() { muteBtn.textContent = muted ? "🔇 소리" : "🔊 소리"; }
refreshMute();
muteBtn.onclick = () => {
  muted = !muted;
  try { localStorage.setItem("sound_muted", muted?"1":"0"); } catch {}
  refreshMute();
  if (!muted) { ensureAudio(); flashPad(0, 200); }
};
window.addEventListener("pointerdown", function once() {
  ensureAudio();
  window.removeEventListener("pointerdown", once);
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
