<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>🔍 틀린 그림 찾기 - 동물 농장</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7a59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="틀린그림">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<style>
  :root {
    --bg1: #fff5e6;
    --bg2: #ffe4b3;
    --accent: #ff7a59;
    --text: #4a3520;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }
  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 12px 12px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  h1 { margin: 4px 0 2px; font-size: 22px; text-align: center; color: var(--accent); text-shadow: 2px 2px 0 #fff; }
  .topnav { width: 100%; display: flex; justify-content: flex-start; }
  .topnav a {
    text-decoration: none; color: var(--accent); background: #fff8e9;
    padding: 6px 12px; border-radius: 10px; font-weight: 700; font-size: 14px;
    box-shadow: 0 2px 0 #e9d8b0;
  }
  .bar {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    background: #fff8e9;
    padding: 10px 10px;
    border-radius: 16px;
    box-shadow: 0 2px 0 #e9d8b0;
    text-align: center;
  }
  .bar .label { font-size: 10px; color: #7a6244; font-weight: 600; }
  .bar .val { font-size: 16px; color: var(--accent); font-weight: 800; }
  .bar .val.small { font-size: 14px; color: #555; }

  .scene-name {
    font-weight: 800; color: var(--accent); font-size: 16px;
    background: #fff8e9; padding: 6px 14px; border-radius: 12px;
    box-shadow: 0 2px 0 #e9d8b0;
  }

  .pics {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .pic-wrap {
    background: #fff8e9;
    padding: 6px;
    border-radius: 14px;
    box-shadow: 0 3px 0 #e9d8b0;
    position: relative;
  }
  .pic-wrap svg { width: 100%; height: auto; display: block; border-radius: 8px; }
  .pic-label {
    position: absolute; top: 8px; left: 10px;
    background: rgba(255,255,255,0.85);
    color: var(--accent); font-weight: 800; font-size: 12px;
    padding: 2px 8px; border-radius: 8px;
  }
  /* 정답 마크 (찾았다) */
  .found-mark {
    fill: none; stroke: #2ec552; stroke-width: 4;
    animation: pop 0.3s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  /* 오답 마크 (X) */
  .wrong-mark {
    stroke: #d96363; stroke-width: 4; stroke-linecap: round;
    animation: shake 0.3s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .btnrow { display: flex; gap: 8px; width: 100%; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  .btn {
    border: none; background: var(--accent); color: white; font-weight: 700;
    padding: 10px 16px; border-radius: 12px; box-shadow: 0 3px 0 #c95838;
    font-size: 15px; cursor: pointer;
  }
  .btn.secondary { background: #fff; color: var(--accent); box-shadow: 0 3px 0 #e9d8b0; }
  .btn.danger { background: #d96363; box-shadow: 0 3px 0 #a14747; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c95838; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center;
    z-index: 10; padding: 16px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fffaf0; padding: 22px; border-radius: 22px;
    text-align: center; box-shadow: 0 10px 0 #c9a76a;
    max-width: 340px; width: 100%;
  }
  .modal h2 { margin: 0 0 10px; color: var(--accent); font-size: 26px; }
  .modal p { margin: 4px 0 12px; font-size: 15px; }
  .big { font-size: 44px; margin: 4px 0; }
  .score-big { font-size: 40px; font-weight: 900; color: var(--accent); margin: 6px 0; line-height: 1; }
  .input {
    width: 100%; border: 2px solid #f0dcae; border-radius: 12px;
    padding: 10px 12px; font-size: 16px; font-family: inherit;
    text-align: center; background: #fff; margin: 6px 0; color: var(--text);
  }
  .input:focus { outline: none; border-color: var(--accent); }
  .ranking {
    text-align: left; background: #fff; border-radius: 12px;
    padding: 10px 12px; margin-top: 8px; max-height: 220px; overflow-y: auto;
  }
  .ranking ol { margin: 0; padding-left: 26px; }
  .ranking li { padding: 10px 0; font-size: 17px; line-height: 1.35; border-bottom: 1px solid #f0e3c0; }
  .ranking li.mine { background: #fff2d0; border-radius: 10px; padding: 12px 12px; margin: 4px -8px; font-weight: 800; font-size: 19px; }
  .ranking .meta { color: #7a6244; font-size: 14px; display: block; margin-left: 0; margin-top: 4px; }
  .ranking .score { float: right; color: var(--accent); font-weight: 800; font-size: 22px; }

  @media (max-width: 560px) {
    .pics { grid-template-columns: 1fr; }
    h1 { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topnav"><a href="./">← 메인</a></div>
  <h1>🔍 틀린 그림 찾기 — 동물 농장</h1>

  <div class="bar">
    <div><div class="label">레벨</div><div class="val" id="levelNum">1</div></div>
    <div><div class="label">찾음</div><div class="val" id="found">0/5</div></div>
    <div><div class="label">실수</div><div class="val small" id="wrong">0</div></div>
    <div><div class="label">시간</div><div class="val small" id="time">0초</div></div>
    <div><div class="label">점수</div><div class="val" id="score">0</div></div>
  </div>

  <div class="scene-name" id="sceneName">…</div>

  <div class="pics">
    <div class="pic-wrap">
      <div class="pic-label">A</div>
      <svg id="svgA" viewBox="0 0 200 150" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="pic-wrap">
      <div class="pic-label">B</div>
      <svg id="svgB" viewBox="0 0 200 150" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>

  <div class="btnrow">
    <button class="btn secondary" id="hintBtn">💡 힌트 (-30점)</button>
    <button class="btn secondary" id="muteBtn">🔊 소리</button>
    <button class="btn danger" id="stopBtn">🛑 그만하기</button>
  </div>

  <p style="font-size:12px; color:#7a6244; text-align:center; margin:6px 0 0;">
    두 그림에서 다른 곳을 5군데 찾아봐요!
  </p>
</div>

<!-- 장면 클리어 -->
<div class="overlay" id="winOverlay">
  <div class="modal">
    <div class="big">🎉</div>
    <h2 id="winTitle">잘 찾았어요!</h2>
    <p id="winText">…</p>
    <div class="btnrow" style="margin-top:10px;">
      <button class="btn" id="winNext">다음 장면 ▶</button>
    </div>
  </div>
</div>

<!-- 게임 종료 (이름 입력) -->
<div class="overlay" id="endOverlay">
  <div class="modal">
    <div class="big">🏁</div>
    <h2>게임 종료!</h2>
    <p id="endSummary">…</p>
    <div class="score-big" id="endScore">0</div>
    <p>이름을 적어줘! (랭킹에 올라가요)</p>
    <input class="input" id="nameInput" maxlength="8" placeholder="예: 토끼1" />
    <div class="btnrow">
      <button class="btn" id="saveScoreBtn">랭킹에 올리기 🏆</button>
    </div>
  </div>
</div>

<!-- 랭킹 -->
<div class="overlay" id="rankOverlay">
  <div class="modal">
    <div class="big">🏆</div>
    <h2>틀린그림 랭킹 TOP 10</h2>
    <div class="ranking" id="rankingList"></div>
    <div class="btnrow" style="margin-top:12px;">
      <button class="btn" id="rankRestartBtn">다시 도전 🔄</button>
    </div>
  </div>
</div>

<script>
// ===== 효과음 =====
let audioCtx = null;
let muted = false;
try { muted = localStorage.getItem("find_muted") === "1"; } catch {}
function ensureAudio() {
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type = "sine", gain = 0.15, when = 0) {
  if (muted) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime + when;
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function sweep(f1, f2, dur, type = "sine", gain = 0.15, when = 0) {
  if (muted) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime + when;
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f1, t0);
  osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
const sfx = {
  found() { tone(880, 0.1, "triangle", 0.18, 0); tone(1175, 0.15, "triangle", 0.18, 0.08); },
  wrong() { sweep(300, 150, 0.18, "square", 0.12); },
  clear() {
    tone(523, 0.12, "triangle", 0.18, 0);
    tone(659, 0.12, "triangle", 0.18, 0.12);
    tone(784, 0.12, "triangle", 0.18, 0.24);
    tone(1046, 0.25, "triangle", 0.2, 0.36);
  },
  gameover() { tone(440, 0.2, "triangle", 0.15, 0); tone(330, 0.2, "triangle", 0.15, 0.18); tone(220, 0.4, "triangle", 0.15, 0.36); },
};

// ===== 상태 =====
let level = 1;
let sceneOrder = 0;
let scene = null;
let activeDiffs = [];  // 이번 라운드 5개
let foundSet = new Set();  // 찾은 diff id
let wrongCount = 0;
let totalWrong = 0;
let totalScore = 0;
let totalSeconds = 0;
let totalLevels = 0;
let levelStart = 0;
let timerId = null;
let usedHint = false;

const $ = (q) => document.querySelector(q);

function pickActiveDiffs(scene) {
  // 무작위 5개 선택
  const pool = scene.diffs.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 5);
}

function startLevel(n) {
  level = n;
  scene = SCENES[(n - 1) % SCENES.length];
  activeDiffs = pickActiveDiffs(scene);
  // 각 diff 마다 50% 확률로 좌/우 변형 스왑 (같은 장면이라도 다른 퍼즐)
  activeDiffs = activeDiffs.map(d => Math.random() < 0.5 ? d : { ...d, left: d.right, right: d.left });
  foundSet = new Set();
  wrongCount = 0;
  usedHint = false;
  levelStart = Date.now();
  $("#sceneName").textContent = scene.name;
  $("#levelNum").textContent = n;
  $("#found").textContent = `0/${activeDiffs.length}`;
  $("#wrong").textContent = "0";
  $("#time").textContent = "0초";
  renderScene();
  if (!timerId) {
    timerId = setInterval(() => {
      const s = Math.floor((Date.now() - levelStart) / 1000);
      $("#time").textContent = s + "초";
    }, 250);
  }
}

function renderScene() {
  const A = $("#svgA"), B = $("#svgB");
  const aFrag = scene.base + activeDiffs.map(d => d.left).join("");
  const bFrag = scene.base + activeDiffs.map(d => d.right).join("");
  A.innerHTML = aFrag + clickOverlay(activeDiffs);
  B.innerHTML = bFrag + clickOverlay(activeDiffs);
  // 이벤트 위임: 클릭된 요소 또는 부모 중 data-diff 있는지 확인
  [A, B].forEach((svg) => {
    svg.addEventListener("click", (e) => {
      let el = e.target;
      while (el && el !== svg && !(el.dataset && el.dataset.diff)) {
        el = el.parentElement;
      }
      if (el && el !== svg && el.dataset && el.dataset.diff) {
        handleClick(el.dataset.diff);
      } else {
        handleMiss(svg, e);
      }
    });
  });
  foundSet.forEach((id) => markFound(id));
}

function clickOverlay(diffs) {
  // 투명한 사각형들 — 클릭 잡이용
  return diffs.map(d =>
    `<rect data-diff="${d.id}"
      x="${d.area.x}" y="${d.area.y}" width="${d.area.w}" height="${d.area.h}"
      fill="transparent" style="cursor:pointer"/>`
  ).join("");
}

function handleClick(diffId) {
  if (foundSet.has(diffId)) return;
  foundSet.add(diffId);
  sfx.found();
  markFound(diffId);
  $("#found").textContent = `${foundSet.size}/${activeDiffs.length}`;
  if (foundSet.size === activeDiffs.length) winLevel();
}

function markFound(diffId) {
  const d = activeDiffs.find(x => x.id === diffId);
  if (!d) return;
  const cx = d.area.x + d.area.w / 2;
  const cy = d.area.y + d.area.h / 2;
  const r = Math.max(d.area.w, d.area.h) / 2;
  ["#svgA", "#svgB"].forEach(sel => {
    const svg = $(sel);
    const ns = "http://www.w3.org/2000/svg";
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", r);
    c.setAttribute("class", "found-mark");
    svg.appendChild(c);
  });
}

function handleMiss(svg, e) {
  wrongCount++;
  totalWrong++;
  $("#wrong").textContent = wrongCount;
  sfx.wrong();
  // 클릭한 위치에 X 표시
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
  const ns = "http://www.w3.org/2000/svg";
  const g = document.createElementNS(ns, "g");
  g.setAttribute("class", "wrong-mark");
  const sz = 6;
  const l1 = document.createElementNS(ns, "line");
  l1.setAttribute("x1", loc.x - sz); l1.setAttribute("y1", loc.y - sz);
  l1.setAttribute("x2", loc.x + sz); l1.setAttribute("y2", loc.y + sz);
  l1.setAttribute("stroke", "#d96363"); l1.setAttribute("stroke-width", "3");
  l1.setAttribute("stroke-linecap", "round");
  const l2 = document.createElementNS(ns, "line");
  l2.setAttribute("x1", loc.x - sz); l2.setAttribute("y1", loc.y + sz);
  l2.setAttribute("x2", loc.x + sz); l2.setAttribute("y2", loc.y - sz);
  l2.setAttribute("stroke", "#d96363"); l2.setAttribute("stroke-width", "3");
  l2.setAttribute("stroke-linecap", "round");
  g.appendChild(l1); g.appendChild(l2);
  svg.appendChild(g);
  setTimeout(() => g.remove(), 600);
}

function winLevel() {
  const sec = Math.max(1, Math.round((Date.now() - levelStart) / 1000));
  totalLevels++;
  totalSeconds += sec;
  const base = 100 + level * 20;
  const speedBonus = Math.max(0, 90 - sec);
  const wrongPenalty = wrongCount * 10;
  const hintPenalty = usedHint ? 30 : 0;
  const gain = Math.max(10, base + speedBonus - wrongPenalty - hintPenalty);
  totalScore += gain;
  $("#score").textContent = totalScore;
  sfx.clear();
  $("#winTitle").textContent = `레벨 ${level} 통과!`;
  $("#winText").textContent =
    `${sec}초 · 실수 ${wrongCount}번` + (usedHint ? " · 힌트 사용" : "") + ` · +${gain}점`;
  $("#winOverlay").classList.add("show");
}

function nextLevel() {
  $("#winOverlay").classList.remove("show");
  startLevel(level + 1);
}

// 힌트: 못 찾은 것 중 하나 잠깐 깜빡
function showHint() {
  if (usedHint) return;
  usedHint = true;
  totalScore = Math.max(0, totalScore - 30);
  $("#score").textContent = totalScore;
  const remaining = activeDiffs.filter(d => !foundSet.has(d.id));
  if (remaining.length === 0) return;
  const d = remaining[Math.floor(Math.random() * remaining.length)];
  const cx = d.area.x + d.area.w / 2;
  const cy = d.area.y + d.area.h / 2;
  const r = Math.max(d.area.w, d.area.h) / 2 + 2;
  ["#svgA", "#svgB"].forEach(sel => {
    const svg = $(sel);
    const ns = "http://www.w3.org/2000/svg";
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", r);
    c.setAttribute("fill", "none");
    c.setAttribute("stroke", "#ffb700");
    c.setAttribute("stroke-width", "3");
    c.setAttribute("stroke-dasharray", "4 3");
    svg.appendChild(c);
    setTimeout(() => c.remove(), 2000);
  });
}

// ===== 게임 종료 / 랭킹 =====
const RANK_KEY = "find_rank_v1";
const NAME_KEY = "find_last_name";
function loadRanking() { try { return JSON.parse(localStorage.getItem(RANK_KEY)) || []; } catch { return []; } }
function saveRanking(arr) { try { localStorage.setItem(RANK_KEY, JSON.stringify(arr)); } catch {} }

function endGame() {
  sfx.gameover();
  $("#endSummary").textContent =
    `레벨 ${level}까지 · 클리어 ${totalLevels}장면 · 실수 ${totalWrong}번 · ${totalSeconds}초`;
  $("#endScore").textContent = totalScore;
  let last = "";
  try { last = localStorage.getItem(NAME_KEY) || ""; } catch {}
  $("#nameInput").value = last;
  $("#endOverlay").classList.add("show");
  setTimeout(() => $("#nameInput").focus(), 100);
}

let lastSavedEntryId = null;

async function postServerRanking(entry) {
  try {
    const r = await fetch("/api/ranking/find", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(entry),
    });
    if (r.ok) return await r.json();
  } catch {}
  return null;
}
async function fetchServerRanking() {
  try {
    const r = await fetch("/api/ranking/find", { cache: "no-store" });
    if (r.ok) return await r.json();
  } catch {}
  return null;
}

async function saveScore() {
  const name = ($("#nameInput").value || "").trim().slice(0, 8) || "토끼";
  try { localStorage.setItem(NAME_KEY, name); } catch {}
  const entry = {
    id: Date.now() + Math.random(),
    name, score: totalScore,
    level, cleared: totalLevels, wrong: totalWrong, seconds: totalSeconds,
    date: new Date().toISOString().slice(0, 10),
  };
  const localList = loadRanking();
  localList.push(entry);
  localList.sort((a, b) => b.score - a.score);
  saveRanking(localList.slice(0, 10));
  lastSavedEntryId = entry.id;
  await postServerRanking(entry);
  $("#endOverlay").classList.remove("show");
  showRanking();
}

async function showRanking() {
  const list = $("#rankingList");
  list.innerHTML = '<p style="text-align:center; color:#7a6244; padding:8px;">불러오는 중…</p>';
  $("#rankOverlay").classList.add("show");

  const server = await fetchServerRanking();
  const ranking = server !== null ? server : loadRanking();
  const source = server !== null ? "🌐 가족 공용" : "📱 이 기기만";

  if (ranking.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7a6244; padding:8px;">아직 기록이 없어요</p>';
  } else {
    const ol = document.createElement("ol");
    ranking.forEach((e) => {
      const li = document.createElement("li");
      if (e.id === lastSavedEntryId) li.className = "mine";
      li.innerHTML = `
        <span>${escapeHtml(e.name)}</span>
        <span class="meta">${e.cleared}장면 · 실수${e.wrong} · ${e.seconds}초 · ${e.date}</span>
        <span class="score">${e.score}점</span>
      `;
      ol.appendChild(li);
    });
    list.innerHTML = `<p style="text-align:center; color:#7a6244; font-size:12px; margin:0 0 6px;">${source}</p>`;
    list.appendChild(ol);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function restartGame() {
  $("#rankOverlay").classList.remove("show");
  level = 1; totalScore = 0; totalSeconds = 0; totalLevels = 0; totalWrong = 0;
  $("#score").textContent = "0";
  startLevel(1);
}

// 이벤트
$("#stopBtn").onclick = () => endGame();
$("#winNext").onclick = () => nextLevel();
$("#hintBtn").onclick = () => showHint();
$("#saveScoreBtn").onclick = () => saveScore();
$("#rankRestartBtn").onclick = () => restartGame();

// 음소거
const muteBtn = $("#muteBtn");
function refreshMuteBtn() { muteBtn.textContent = muted ? "🔇 소리" : "🔊 소리"; }
refreshMuteBtn();
muteBtn.onclick = () => {
  muted = !muted;
  try { localStorage.setItem("find_muted", muted ? "1" : "0"); } catch {}
  refreshMuteBtn();
  if (!muted) { ensureAudio(); sfx.found(); }
};
function wakeAudioOnce() {
  ensureAudio();
  window.removeEventListener("pointerdown", wakeAudioOnce);
}
window.addEventListener("pointerdown", wakeAudioOnce);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

startLevel(1);
