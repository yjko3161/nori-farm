<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>🐰 동물 농장 놀이터</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7a59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="농장놀이터">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root {
    --bg1: #fff5e6;
    --bg2: #ffe4b3;
    --accent: #ff7a59;
    --text: #4a3520;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    min-height: 100vh;
    user-select: none;
  }
  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 30px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  h1 {
    margin: 12px 0 6px;
    font-size: 32px;
    text-align: center;
    color: var(--accent);
    text-shadow: 2px 2px 0 #fff;
  }
  .sub { color: #7a6244; text-align: center; margin: 0 0 18px; font-size: 15px; }
  .games {
    display: flex; flex-direction: column; gap: 14px;
    width: 100%;
  }
  .game-card {
    background: #fff8e9;
    border-radius: 22px;
    padding: 22px 20px;
    box-shadow: 0 5px 0 #e9d8b0;
    text-decoration: none;
    color: var(--text);
    display: flex; align-items: center; gap: 16px;
    transition: transform 80ms ease;
    cursor: pointer;
  }
  .game-card:active { transform: translateY(2px); box-shadow: 0 3px 0 #e9d8b0; }
  .game-emoji { font-size: 56px; flex-shrink: 0; }
  .game-info h2 {
    margin: 0 0 4px;
    color: var(--accent);
    font-size: 22px;
  }
  .game-info p { margin: 0; font-size: 14px; color: #7a6244; line-height: 1.4; }
  .footer { font-size: 12px; color: #7a6244; margin-top: 20px; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <h1>🐰 동물 농장 놀이터 🥕</h1>
  <p class="sub">놀고 싶은 게임을 골라보세요!</p>

  <div class="games">
    <a class="game-card" href="maze.html">
      <div class="game-emoji">🌀</div>
      <div class="game-info">
        <h2>미로 찾기</h2>
        <p>토끼가 당근을 찾아가요. 매번 다른 미로! 무한 도전 + 랭킹</p>
      </div>
    </a>

    <a class="game-card" href="find.html">
      <div class="game-emoji">🔍</div>
      <div class="game-info">
        <h2>틀린 그림 찾기</h2>
        <p>두 그림에서 다른 곳을 찾아봐요. 동물 농장 장면 + 랭킹</p>
      </div>
    </a>
  </div>

  <p class="footer">초등학교 1학년을 위한 놀이 모음</p>
</div>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
