name = "nori-farm-api"
main = "worker/api-worker.js"
compatibility_date = "2025-01-01"

# D1 데이터베이스 바인딩
# database_id 는 Cloudflare 대시보드 → Workers & Pages → D1 → nori-farm-db
# 페이지의 "Database ID" (32자리 영문숫자)로 교체
[[d1_databases]]
binding = "DB"
database_name = "nori-farm-db"
database_id = "PASTE_D1_DATABASE_ID_HERE"

# 도메인 라우트
routes = [
  { pattern = "www.nori-farm.com/api/ranking/*", zone_name = "nori-farm.com" }
]

# 선택: DELETE 보호 토큰 (배포 후 wrangler secret put ADMIN_TOKEN 으로 별도 설정)
